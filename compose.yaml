name: botbookyoucourt

x-bot-service: &bot-service
  build:
    context: .
    dockerfile: Dockerfile
  image: botbookyoucourt:local
  init: true
  restart: "no"
  # Run as host user passakorn (uid/gid 1000) so log/state files written by
  # the container are owned by passakorn, not root/nobody — prevents EACCES
  # collisions with host-side `bun run ...` commands sharing the same dirs.
  user: "1000:1000"
  env_file:
    - .env
  environment:
    TZ: Asia/Bangkok
  volumes:
    - ./config.json:/app/config.json:ro
    - ./logs:/app/logs
    - ./state:/app/state

services:
  race:
    <<: *bot-service
    command: ["run"]

  fallback:
    <<: *bot-service
    command: ["run", "--now"]

  dry-run:
    <<: *bot-service
    command: ["dry-run"]

  status:
    <<: *bot-service
    command: ["status"]

  scheduler:
    <<: *bot-service
    restart: unless-stopped
    entrypoint: ["sh", "/app/scripts/scheduler.sh"]
    command: []

